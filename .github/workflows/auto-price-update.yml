name: Clock Bot

on:
  workflow_dispatch:
  schedule:
    # run every 15 minutes, offset away from the congested :00/:05/:30 marks
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: clock-bot
  cancel-in-progress: false

jobs:
  update-time:
    name: Update timestamp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        id: ts
        run: |
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          {
            echo "Last Updated (UTC): $NOW"
            echo "This is an automated update to verify PR creation."
          } > TIMESTAMP.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update timestamp"
          title: "⏰ Time Update: ${{ steps.ts.outputs.now }}"
          body: "Automated timestamp update to verify the PR pipeline."
          branch: auto-time-update
          delete-branch: true