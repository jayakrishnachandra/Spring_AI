name: Clock Bot
on:
  schedule:
    - cron: '*/5 * * * *' # Fastest possible GitHub cron
  workflow_dispatch: # THE TEST BUTTON

jobs:
  update-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          echo "Last Updated (UTC): $(date -u)" > TIMESTAMP.md
          echo "This is an automated update to verify PR creation." >> TIMESTAMP.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update timestamp"
          title: "⏰ Time Update: $(date -u)"
          body: "Automated timestamp update to verify the PR pipeline."
          branch: auto-time-update
          delete-branch: true
