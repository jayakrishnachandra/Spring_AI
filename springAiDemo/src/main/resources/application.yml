spring:
  application:
    name: springAiDemo
  output:
    ansi:
      enabled: ALWAYS


  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:cloud
      init:
        pull-model-strategy: when_missing
      embedding:
        model: mxbai-embed-large
#        is default model for embedding with ollama

    vectorstore:
      mongodb:
        initialize-schema: true
        collection-name: custom_vector_store
        index-name: custom_vector_index2
        path-name: embedding    #where the embedding is stored in the document

    mcp:
      client:
        stdio:
          servers-configuration: classpath:/mcp-servers-config.json


